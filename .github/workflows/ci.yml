name: M0 checks and builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev
      - run: flutter pub get --enforce-lockfile
      - run: python ../tools/phase1-screens/verify.py
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
  backend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.7'
      - run: deno test supabase/functions
      - uses: supabase/setup-cli@v1
        with:
          version: '2.75.0'
      - run: supabase start
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ${{ matrix.target }} --release
