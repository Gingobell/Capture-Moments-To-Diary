  share_plus: 12.0.2
  sign_in_with_apple: 8.2.0
  speech_to_text: 7.5.0
  sqlite3_flutter_libs: 0.6.0+eol
  supabase_flutter: 2.18.3
  tray_manager: 0.8.0
  uuid: 4.6.0
