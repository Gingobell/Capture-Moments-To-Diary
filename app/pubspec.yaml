name: capture_moment
description: "Capture small moments and bring them together into a diary."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: 3.13.5

dependencies:
  app_links: 7.2.2
  connectivity_plus: 7.3.2
  drift: 2.35.2
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_svg: 2.3.0
  go_router: 18.1.1
  google_sign_in: 7.2.0
