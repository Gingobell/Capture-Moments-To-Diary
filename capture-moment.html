<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capture Moment to Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital@0;1&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Design tokens: every color lives here once. Day is :root; Night is :root[data-theme="night"]
   (and the same values in the dark-mode guard, used before the app sets data-theme). */
:root{
  /* Page and text */
  --bg:#FBFBF7;
  --ink:#3D4350;
  --ink-muted:#6A707E;
  --line:rgba(61,67,80,.09);
  --shadow-dark:#EBEFF3;
  --shadow-light:#FFFFFF;
  --danger:#9E4440;
  /* Accent (Day lemon / Night lavender) */
  --accent:#FFEB7A;
  --on-accent:#4D4210;
  --accent-strong:#A88214;
  --accent-soft:#FFF7CF;
  --accent-grad:linear-gradient(180deg,#FFFDF1,#FFF2C6);
  --accent-glow:rgba(230,200,90,.45);
  --save:rgba(255,232,96,.62);
  --save-glow:rgba(230,190,40,.4);
  --tab-dot:#F2C82B;
  /* Glass */
  --gl:rgba(255,255,255,.62);
  --glass:rgba(255,255,255,.66);
  --glass-sh:rgba(110,130,150,.22);
  --rim:rgba(160,150,110,.16);
  --drop:rgba(120,108,60,.22);
  --raised:inset 0 1px 0 #fff, inset 0 0 0 1px rgba(255,255,255,.8), 0 0 0 1px var(--rim), 0 6px 14px -10px var(--drop);
  --inset:inset 0 0 0 1px var(--rim), inset 0 2px 4px -2px var(--drop);
  --o:3px;
  --blur:9px;
  --halo:rgba(255,222,70,.5);
  --corner:rgba(255,222,70,.26);
  /* Candies (jar, clothesline, clips) and starter dots */
  --c1:#F8F04E;
  --c2:#B3F23C;
  --c3:#6EF0D8;
  --c4:#D2B4FF;
  --c5:#FF9AD6;
  --syrup-op:.36;
  --sd1:#F7D531;
  --sd2:#FF9FB8;
  --sd3:#86CFF5;
  /* First-time tips */
  --tip-glow:#FFE24A;
  --tip-ring:rgba(232,200,60,.75);
  /* Type */
  --sans: "Nunito", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --serif: "Literata", "Songti SC", "Noto Serif SC", Georgia, serif;
  /* Page setup */
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="day"]){
    /* Page and text */
    --bg:#F9F9FC;
    --ink:#424057;
    --ink-muted:#6C6981;
    --line:rgba(66,64,87,.09);
    --shadow-dark:#ECECF3;
    --shadow-light:#FFFFFF;
    /* Accent (Day lemon / Night lavender) */
    --accent:#E7E0FC;
    --on-accent:#3D346E;
    --accent-strong:#7B68C4;
    --accent-soft:#F1EDFD;
    --accent-grad:linear-gradient(180deg,#FBFAFF,#ECE7FD);
    --accent-glow:rgba(150,130,230,.42);
    --save:rgba(214,202,255,.7);
    --save-glow:rgba(140,118,230,.32);
    --tab-dot:#B9A8F5;
    /* Glass */
    --glass:rgba(255,255,255,.66);
    --glass-sh:rgba(120,120,170,.22);
    --rim:rgba(130,125,180,.16);
    --drop:rgba(90,84,140,.22);
    --o:3px;
    --blur:8px;
    --halo:rgba(180,160,255,.42);
    --corner:rgba(180,160,255,.26);
    /* Candies (jar, clothesline, clips) and starter dots */
    --c1:#C7B6FF;
    --c2:#FFB0D4;
    --c3:#A8D6FF;
    --c4:#E3C4FF;
    --c5:#F6E3A0;
    --syrup-op:.62;
    --sd1:#B9A8F5;
    --sd2:#FFA9CC;
    --sd3:#8EC6F5;
    /* First-time tips */
    --tip-glow:#C7B6FF;
    --tip-ring:rgba(160,140,230,.6);
    /* Page setup */
    color-scheme: light;
  }
}
:root[data-theme="night"]{
  /* Page and text */
  --bg:#F9F9FC;
  --ink:#424057;
  --ink-muted:#6C6981;
  --line:rgba(66,64,87,.09);
  --shadow-dark:#ECECF3;
  --shadow-light:#FFFFFF;
  /* Accent (Day lemon / Night lavender) */
  --accent:#E7E0FC;
  --on-accent:#3D346E;
  --accent-strong:#7B68C4;
  --accent-soft:#F1EDFD;
  --accent-grad:linear-gradient(180deg,#FBFAFF,#ECE7FD);
  --accent-glow:rgba(150,130,230,.42);
  --save:rgba(214,202,255,.7);
  --save-glow:rgba(140,118,230,.32);
  --tab-dot:#B9A8F5;
  /* Glass */
  --glass:rgba(255,255,255,.66);
  --glass-sh:rgba(120,120,170,.22);
  --rim:rgba(130,125,180,.16);
  --drop:rgba(90,84,140,.22);
  --o:3px;
  --blur:8px;
  --halo:rgba(180,160,255,.42);
  --corner:rgba(180,160,255,.26);
  /* Candies (jar, clothesline, clips) and starter dots */
  --c1:#C7B6FF;
  --c2:#FFB0D4;
  --c3:#A8D6FF;
  --c4:#E3C4FF;
  --c5:#F6E3A0;
  --syrup-op:.62;
  --sd1:#B9A8F5;
  --sd2:#FFA9CC;
  --sd3:#8EC6F5;
  /* First-time tips */
  --tip-glow:#C7B6FF;
  --tip-ring:rgba(160,140,230,.6);
  /* Page setup */
  color-scheme: light;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); min-height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0;
  min-height:100%;
  color:var(--ink);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button, input, textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--accent-strong); outline-offset:3px; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
svg.i{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none; }
/* Layout */
.app{ max-width:560px; margin:0 auto; padding:8px 20px calc(104px + env(safe-area-inset-bottom, 0px)); }
.top{ display:flex; align-items:center; gap:8px; min-height:64px; padding:8px 0 16px; }
.top h1{ flex:1; margin:0; font-size:28px; font-weight:600; line-height:1.2; letter-spacing:-0.01em; }
.top .back + h1{ font-size:22px; }
.nightmark{ display:none; margin-left:10px; vertical-align:middle; color:var(--accent-strong); opacity:.45; }
.nightmark svg{ width:22px; height:22px; display:block; }
.iconbtn{ width:44px; height:44px; border-radius:50%; border:0; color:var(--ink); display:grid; place-items:center; transition:background .2s ease-out, box-shadow .2s ease-out; }
.iconbtn:hover{ background:var(--accent-soft); }
.iconbtn:active{ box-shadow:var(--inset); }
.status{ font-size:13px; color:var(--ink-muted); margin:4px 0 0; text-align:center; }
.status:empty{ display:none; }
/* Capture */
.intro{ display:flex; align-items:flex-start; gap:8px; font-size:15px; color:var(--ink); margin:0 0 16px; padding:10px 6px 10px 16px; background:var(--accent-soft); border-radius:16px; }
.intro p{ margin:10px 0; flex:1; }
.capture{ background:var(--bg); border-radius:24px; box-shadow:var(--raised); padding:16px; }
.field{ display:block; width:100%; border:0; border-radius:16px; padding:14px 16px; color:var(--ink); resize:none; line-height:1.55; }
.field::placeholder{ color:var(--ink-muted); opacity:1; }
.capture .field{ min-height:120px; max-height:50vh; }
.capture-row{ display:flex; align-items:center; justify-content:flex-end; margin-top:16px; }
.capture-note{ font-size:13px; color:var(--ink-muted); margin:12px 4px 0; }
.capture-note:empty{ display:none; }
.mic{
  width:48px; height:48px; border-radius:50%; border:0; background:var(--accent); color:var(--on-accent);
  box-shadow:var(--raised); display:grid; place-items:center; transition:box-shadow .2s ease-out;
}
.mic:active, .mic.listening{ box-shadow:var(--inset); }
.mic.listening{ animation:pulse 1.6s ease-in-out infinite; }
.mic:disabled{ background:var(--bg); color:var(--ink-muted); box-shadow:none; cursor:default; animation:none; }
@keyframes pulse{ 50%{ background:var(--accent-soft); } }
.btn-primary, .btn{
  border:0;
  font-size:15px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:var(--raised);
  transition:box-shadow .2s ease-out, transform .2s ease-out;
}
.btn-primary:active, .btn:active{ transform:translateY(1px); }
.btn-primary:disabled, .btn:disabled{ cursor:default; transform:none; }
.link{
  min-height:44px; padding:0 4px; border:0; background:none; color:var(--ink); font-size:15px;
  text-decoration:underline; text-decoration-color:var(--accent-strong); text-decoration-thickness:1.5px; text-underline-offset:2px;
  display:inline-flex; align-items:center; gap:6px;
}
.link:disabled{ color:var(--ink-muted); text-decoration-color:var(--shadow-dark); cursor:default; }
.link.danger, .danger{ color:var(--danger); text-decoration-color:var(--danger); }
.secondary-action{ display:flex; justify-content:center; margin-top:12px; }
.center{ display:flex; justify-content:center; margin:32px 0 8px; }
/* Lists */
h2{ font-size:15px; font-weight:600; color:var(--ink-muted); margin:40px 0 8px; }
.empty{ color:var(--ink-muted); font-size:15px; margin:40px 0 0; text-align:center; }
.list{ list-style:none; margin:0; padding:0; }
.moment{
  width:100%; display:grid; grid-template-columns:4.75rem 1fr; gap:0 12px; align-items:baseline;
  padding:14px 4px; border:0; border-bottom:1px solid var(--shadow-dark); background:none; text-align:left; border-radius:0;
}
.list li:last-child .moment{ border-bottom:0; }
.moment:hover{ background:color-mix(in srgb, var(--accent-soft) 60%, transparent); }
.moment time{ font-size:13px; color:var(--ink-muted); font-variant-numeric:tabular-nums; }
.moment .t{ white-space:pre-wrap; overflow-wrap:anywhere; }
.moment .src{ display:block; font-size:13px; color:var(--ink-muted); margin-top:2px; }
.settle{ animation:settle .25s ease-out; }
@keyframes settle{ from{ opacity:0; transform:translateY(-8px); } }
.unf{ padding:12px 0; border-bottom:1px solid var(--shadow-dark); }
.unf:last-child{ border-bottom:0; }
.unf p{ margin:0; white-space:pre-wrap; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.unf .meta{ font-size:13px; color:var(--ink-muted); margin-top:2px; }
.actions{ display:flex; flex-wrap:wrap; gap:4px 18px; margin-top:4px; }
/* Timeline */
.search{ position:relative; margin:0 0 20px; }
.search[hidden]{ display:none; }
.search > svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--ink-muted); width:18px; height:18px; }
.search .field{ padding:0 44px 0 42px; min-height:44px; border-radius:999px; font-size:15px; transition:border-color .2s ease-out; }
.search .field:focus{ border-color:var(--accent-strong); }
.search .field::-webkit-search-cancel-button{ display:none; }
.search .s-x{ position:absolute; right:2px; top:50%; transform:translateY(-50%); width:40px; height:40px; }
.search .s-x svg{ width:18px; height:18px; }
.page-sub{ margin:-8px 0 24px; font-size:15px; color:var(--ink-muted); }
.iconbtn[aria-expanded="true"]{ background:var(--accent-soft); }
.dayrow{
  width:100%; display:flex; align-items:center; gap:12px; padding:16px 4px; border:0; border-bottom:1px solid var(--shadow-dark);
  background:none; text-align:left;
}
.dayrow:hover{ background:color-mix(in srgb, var(--accent-soft) 60%, transparent); }
.dayrow .d{ flex:1; font-weight:600; }
.dayrow .n{ font-size:15px; color:var(--ink-muted); }
.badge{ display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--ink); background:var(--accent-soft); border-radius:999px; padding:2px 10px 2px 6px; }
.badge svg.i{ width:16px; height:16px; }
.result{ width:100%; display:block; padding:12px 4px; border:0; border-bottom:1px solid var(--shadow-dark); background:none; text-align:left; }
.result .k{ font-size:13px; color:var(--ink-muted); display:block; }
.result .t{ overflow-wrap:anywhere; }
mark{ background:var(--accent-soft); color:inherit; border-radius:4px; padding:0 2px; box-shadow:inset 0 -2px 0 var(--accent-strong); }
/* Day / diary */
.diary-block{ margin:0 0 8px; }
.diary-text{ font-family:var(--serif); font-size:17px; line-height:1.75; max-width:68ch; overflow-wrap:anywhere; }
.diary-text p{ margin:0 0 1em; }
.diary-text .thinking{ font-family:var(--sans); color:var(--ink-muted); font-size:15px; }
.notice{ border-radius:16px; padding:10px 16px; font-size:15px; margin:0 0 16px; }
.notice .link{ min-height:32px; }
.srcs{ margin:4px 0 16px; padding:8px 0 0 16px; border-left:2px solid var(--shadow-dark); }
.srcs p{ margin:0 0 8px; font-size:15px; color:var(--ink-muted); white-space:pre-wrap; }
.day-actions{ display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; }
/* Day view: one action style everywhere */
.acts{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:16px; }
.acts .grow{ flex:1; }
.act{
  display:inline-flex;
  align-items:center;
  gap:6px;
  min-height:40px;
  padding:0 14px;
  border-radius:999px;
  color:var(--ink);
  font-size:14px;
  font-weight:600;
  transition:background .2s ease-out, border-color .2s ease-out;
}
.act svg.i{ width:16px; height:16px; color:var(--ink-muted); }
.act.danger{ color:var(--danger); }
.act.icon{ width:40px; padding:0; justify-content:center; }
.act.danger svg.i{ color:var(--danger); }
.act.danger:hover{ border-color:color-mix(in srgb, var(--danger) 40%, transparent); }
.notice{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
.notice p{ flex:1; min-width:180px; margin:0; }
.diary-empty{ padding:24px 20px; border:1.5px dashed var(--shadow-dark); border-radius:20px; text-align:center; }
.diary-empty p{ margin:0 0 14px; color:var(--ink-muted); font-size:15px; }
.diary-empty p:last-child{ margin:0; }
.sec-h{ display:flex; align-items:center; gap:8px; width:100%; min-height:44px; margin:32px 0 4px; padding:0; border:0; background:none; text-align:left; font-size:15px; font-weight:600; color:var(--ink-muted); }
.sec-h .n{ font-weight:400; }
.sec-h svg.i{ width:18px; height:18px; margin-left:auto; transition:transform .2s ease-out; }
.sec-h[aria-expanded="true"] svg.i{ transform:rotate(180deg); }
button.sec-h:hover{ color:var(--ink); }
.add-row{ display:flex; align-items:center; gap:12px; width:100%; min-height:52px; padding:0 4px; border:0; background:none; text-align:left; color:var(--ink-muted); font-size:15px; font-weight:600; transition:color .2s ease-out; }
.add-row .plus{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; color:var(--accent-strong); flex:none; }
.add-row .plus svg.i{ width:16px; height:16px; }
.add-row:hover{ color:var(--ink); }
/* Past conversations */
.chat-list{ list-style:none; margin:4px 0 0; padding:0; }
.chat-item{ display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--shadow-dark); }
.chat-list li:last-child .chat-item{ border-bottom:0; }
.ci-main{ flex:1; min-width:0; display:block; padding:12px 4px; border:0; background:none; text-align:left; color:var(--ink); }
.ci-main:hover{ background:color-mix(in srgb, var(--accent-soft) 50%, transparent); }
.ci-d{ display:block; font-size:13px; font-weight:600; color:var(--ink-muted); }
.ci-d .m{ font-weight:400; margin-left:6px; }
.ci-t{ display:block; font-size:16px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ci-p{ display:block; font-size:14px; color:var(--ink-muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ci-now{ font-size:12px; font-weight:600; color:var(--accent-strong); padding:0 8px; white-space:nowrap; }
.sheet-head .act{ flex:none; }
@media (max-width:420px){
  .act.hist{ width:40px; padding:0; justify-content:center; }
  .act.hist .lbl{ display:none; }
}
.sheet-head h3{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
/* Tab bar */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:10; padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.tabbar-in{ max-width:560px; margin:0 auto; display:flex; gap:12px; }
.tab{
  flex:1;
  min-height:48px;
  border:0;
  border-radius:16px;
  background:transparent;
  font-size:15px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.tab[aria-current="page"]{ border-bottom-color:var(--accent-strong); }
body.kb .tabbar{ display:none; }
/* Sheets */
.scrim{
  position:fixed; left:0; right:0; top:var(--vvt, 0px); height:var(--vvh, 100%); z-index:30;
  background:color-mix(in srgb, var(--ink) 18%, transparent);
  display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease-out;
}
.sheet{
  width:100%;
  max-width:560px;
  max-height:calc(100% - 16px - env(safe-area-inset-top, 0px));
  overflow:auto;
  padding:12px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  animation:up .25s ease-out;
}
.sheet.full{ height:calc(100% - 12px - env(safe-area-inset-top, 0px)); display:flex; flex-direction:column; overflow:hidden; padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px)); }
.sheet-head{ display:flex; align-items:center; gap:8px; min-height:52px; margin-bottom:8px; }
.sheet-head h3{ flex:1; margin:0; font-size:22px; font-weight:600; line-height:1.25; }
.sheet p.body{ margin:0 0 20px; }
.sheet-foot{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-top:20px; }
.sheet-foot .grow{ flex:1; }
@keyframes fade{ from{ opacity:0; } }
@keyframes up{ from{ transform:translateY(24px); opacity:.4; } }
label.lbl{ display:block; font-size:13px; color:var(--ink-muted); margin:16px 0 6px; }
input[type="date"].field{ min-height:48px; max-width:220px; padding:10px 14px; }
.hint{ font-size:13px; color:var(--ink-muted); margin:8px 2px 0; }
.err{ font-size:15px; color:var(--danger); margin:8px 0 0; }
.checks{ list-style:none; margin:0; padding:0; }
.styles{ display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:6px; margin:0 0 20px; border-radius:18px; box-shadow:var(--inset); }
.styles button{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; min-height:60px; padding:10px 12px; border:0; border-radius:14px; background:transparent; color:var(--ink); text-align:left; cursor:pointer; font:inherit; }
.styles button b{ font-size:15px; font-weight:600; }
.styles button span{ font-size:13px; color:var(--ink-muted); line-height:1.35; }
.styles button[aria-checked="true"]{ background:var(--bg); box-shadow:var(--raised); }
.styles button[aria-checked="true"] b{ color:var(--accent-strong); }
.checks label{ display:flex; gap:12px; align-items:flex-start; padding:12px; border-radius:16px; margin-bottom:6px; cursor:pointer; }
.checks input{ width:22px; height:22px; margin:2px 0 0; accent-color:var(--accent-strong); flex:none; }
.checks .t{ white-space:pre-wrap; overflow-wrap:anywhere; }
.checks time{ display:block; font-size:13px; color:var(--ink-muted); }
.seg{ display:flex; gap:8px; box-shadow:var(--inset); }
.seg button{ flex:1; min-height:44px; border:0; background:transparent; font-weight:600; font-size:15px; }
.seg button[aria-pressed="true"]{ background:var(--bg); box-shadow:var(--raised); }
.privacy{ font-size:15px; color:var(--ink-muted); margin:0; }
.diary-field{ font-family:var(--serif); line-height:1.75; flex:1; min-height:240px; }
/* Chat */
.chat-log{ flex:1; overflow:auto; padding:4px 2px 16px; display:flex; flex-direction:column; gap:14px; }
.msg{ max-width:85%; white-space:pre-wrap; overflow-wrap:anywhere; padding:10px 14px; line-height:1.5; }
.msg.ai{ align-self:flex-start; border-radius:18px 18px 18px 6px; }
.msg.me{ align-self:flex-end; color:var(--on-accent); border-radius:18px 18px 6px 18px; }
.msg.wait{ color:var(--ink-muted); font-size:15px; }
.typing{ display:inline-flex; gap:5px; padding:7px 2px; }
.typing i{ width:7px; height:7px; border-radius:50%; background:var(--ink-muted); opacity:.45; animation:blink 1.2s ease-in-out infinite; }
.typing i:nth-child(2){ animation-delay:.2s; }

.chips{ display:flex; flex-wrap:wrap; gap:10px; align-self:flex-start; }
.chip{ min-height:44px; padding:0 18px; border-radius:999px; border:0; background:var(--bg); color:var(--ink); box-shadow:var(--raised); font-size:15px; font-weight:600; transition:box-shadow .2s ease-out; }

.chat-log .card, .chat-log .care, .chat-log .err, .chat-log .hint{ align-self:stretch; }

.chat-input{ display:flex; gap:10px; align-items:flex-end; }

.send{ width:48px; height:48px; border-radius:50%; border:0; flex:none; color:var(--on-accent); display:grid; place-items:center; }

.chat-tools{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:8px; }
.card{ border-radius:24px; padding:16px; margin:4px 0 8px; }

.care{ font-size:13px; color:var(--ink-muted); }
.chat-note{ align-self:stretch; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px 12px; padding:10px 10px 10px 16px; border-radius:18px; background:rgba(255,255,255,.62); border:1px solid #fff; box-shadow:0 0 0 1px var(--line); font-size:14px; color:var(--ink-muted); }

.eve-nudge{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:0 14px; max-width:440px; margin:14px auto 0; font-size:15px; color:var(--ink-muted); text-align:center; }

.eve-nudge .link.quiet{ color:var(--ink-muted); font-size:13px; text-decoration-color:var(--line); }

.profile{ display:flex; align-items:center; gap:16px; padding:16px; border-radius:24px; box-shadow:var(--inset); margin-bottom:8px; }

/* Home */
#view-home:not([hidden]){ display:flex; flex-direction:column; min-height:calc(100dvh - 200px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.home-top{ text-align:center; padding-top:8px; }
.home-mid{ width:100%; }
.jar-btn{ display:block; margin:0 auto 14px; padding:8px; border:0; background:none; border-radius:32px; cursor:pointer; transition:transform .2s ease-out; }
.jar-btn:hover{ transform:translateY(-2px); }
.jar-btn:active{ transform:scale(.96); }
.jar{ overflow:visible; }
.jar-btn.shake .jar{ animation:wiggle .8s ease-out; transform-origin:50% 90%; }
@keyframes wiggle{ 20%{ transform:rotate(-7deg); } 45%{ transform:rotate(6deg); } 70%{ transform:rotate(-3deg); } }
.hero-lead{ font-family:var(--serif); font-size:28px; line-height:1.2; margin:0 0 6px; letter-spacing:-0.01em; }
.hero-sub{ font-size:15px; color:var(--ink-muted); margin:0; }
.jar-hint{ font-size:13px; color:var(--ink-muted); margin:10px 0 0; }
.jar .ln{ fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.jar .glass{ fill:var(--bg); }
.jar .slip{ fill:var(--accent); stroke:var(--ink); stroke-width:1.5; }
.jar .slip.alt{ fill:var(--accent-soft); stroke:var(--accent-strong); }
.jar .rule{ stroke:var(--ink-muted); stroke-width:1.25; stroke-linecap:round; }
.jar .drop{ animation:drop 1.1s .25s ease-out both; transform-box:fill-box; transform-origin:center; }
@keyframes drop{ from{ opacity:0; transform:translate(10px,-14px) rotate(-30deg); } }
.entry{ padding:18px; }
.entry-field{

}

.entry-row > button{ flex:1; padding:0 14px; white-space:nowrap; min-height:52px; font-size:17px; }
.starters{ display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:16px; }
.starter{
  min-height:36px;

  border-radius:999px;

  font-weight:600;

.peek:last-child{ border-bottom:0; }
.peek:hover{ background:color-mix(in srgb, var(--accent-soft) 60%, transparent); }
.peek .k{ display:block; font-weight:600; }
.peek .t{ display:block; font-size:15px; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.home-bottom h2{ margin-top:0; }
.home-foot{ font-size:13px; color:var(--ink-muted); margin:16px 0 0; text-align:center; }
@media (max-height:720px){

  .hero-lead{ font-size:24px; }

}
/* Pop-ups (How it works, dictation tip): any tap closes them */
.pop-scrim{ position:fixed; inset:0; z-index:90; display:grid; place-items:center; padding:24px; background:color-mix(in srgb, var(--ink) 14%, transparent); animation:fade .2s ease-out; cursor:pointer; }

.pop span.d{ display:block; font-size:15px; color:var(--ink-muted); }

/* Home capture card */
.entry .field{ font-size:19px; min-height:112px; }
.capture-row{ gap:12px; }

.tool{ display:flex; align-items:center; min-width:56px; white-space:nowrap; border:0; }
.tool-ic{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; transition:box-shadow .2s ease-out, background .2s ease-out; }

/* Today so far (Home) */
.today-sum{ margin-top:24px; }
.today-sum h2{ margin:0 0 6px; }
.ts-row{ display:flex; flex-wrap:wrap; gap:4px 24px; }
.ts-link{ display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0; border:0; background:none; color:var(--ink); font-size:17px; }

.ts-link.muted{ color:var(--ink-muted); }
@keyframes dotpop{ 0%{ transform:scale(.4); } 60%{ transform:scale(1.25); } 100%{ transform:scale(1); } }
.new-tag{ display:inline-block; margin-left:6px; padding:2px 8px; border-radius:999px; color:var(--ink); font-size:12px; font-weight:600; vertical-align:middle; }
.jar .fall{ animation:fallin .9s ease-out both; transform-box:fill-box; transform-origin:center; }
@keyframes fallin{ 0%{ opacity:.7; transform:translate(2px,-34px) rotate(-12deg); } 70%{ opacity:1; transform:translate(0,3px) rotate(2deg); } 100%{ transform:none; } }
.fly-slip{ position:fixed; z-index:60; box-sizing:border-box; margin:0; border-radius:16px; background:var(--accent-soft); border:1.5px solid var(--accent-strong); color:var(--ink); padding:10px 12px; font:17px/1.4 var(--sans); overflow:hidden; pointer-events:none; white-space:pre-wrap; word-break:break-word; }
.jar-plus{ position:fixed; z-index:61; font-size:15px; font-weight:600; color:var(--accent-strong); pointer-events:none; }
.unf-list{ margin-top:20px; }
/* Compact top: jar beside the title, then Today so far and Lucky diary side by side as two tiles */
.hero{ display:flex; align-items:center; justify-content:center; gap:14px; max-width:440px; margin:0 auto; text-align:left; }
.hero .jar-btn{ margin:0; padding:4px; flex:none; }
/* Home header: the app title and subline replace the greeting, so the jar gets its own row */
.home-hd{ flex:1; min-width:0; }
.top .home-hd h1.hero-lead{ flex:none; margin:0 0 2px; font-family:var(--serif); font-size:25px; font-weight:400; line-height:1.2; }
.top .home-hd .nightmark{ margin-left:6px; }

}

#home-near{ max-width:440px; margin:0 auto; }

#home-near .near-grid.two{ grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
.tile{ border:1px solid var(--shadow-dark); border-radius:20px; padding:10px 14px; text-align:left; }
#home-near .today-sum h2{ margin:0 0 2px; font-size:13px; }

@media (max-width:400px){

}

  .top .home-hd h1.hero-lead{ font-size:22px; }
}
.unf-list:first-child{ margin-top:24px; }
/* Lucky diary: a button on Home; the diary itself is only revealed in its sheet */
.luck-btn{ display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:6px; width:100%; margin:0; padding:10px 14px; text-align:left; border:1px solid var(--shadow-dark); border-radius:20px; background:transparent; color:var(--ink); transition:background .2s ease-out, border-color .2s ease-out; }
.luck-btn:hover{ background:color-mix(in srgb, var(--accent-soft) 60%, transparent); border-color:var(--accent); }

.luck-top b{ flex:1; min-width:0; font-size:15px; font-weight:600; }
.luck-top svg.i{ width:16px; height:16px; color:var(--ink-muted); flex:none; transition:transform .2s ease-out; }
.luck-btn:hover .luck-top svg.i{ transform:translateX(2px); }
.luck-g{ font-size:13px; line-height:1.35; color:var(--ink-muted); }
.luck-ic svg{ width:16px !important; height:16px !important; }
.luck-ic svg, .luck-title svg{ width:22px; height:22px; fill:var(--accent-strong); stroke:none; }
.luck-btn:hover .luck-ic svg{ animation:twinkle .6s ease-out; }
@keyframes twinkle{ 40%{ transform:scale(1.2) rotate(12deg); } }
.luck-title{ display:flex; align-items:center; gap:8px; }
.luck-when{ display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; margin:0 0 12px; font-size:15px; }
.luck-when b{ font-weight:600; }
.luck-when span{ font-size:13px; color:var(--ink-muted); }
.luck-reveal{ animation:luckin .45s ease-out; }
@keyframes luckin{ 0%{ opacity:0; transform:translateY(10px) rotate(-1deg); } 60%{ opacity:1; transform:translateY(-2px); } 100%{ transform:none; } }
/* Moments + Diary tabs */
.dayg{ margin-top:28px; }
.dayg:first-child{ margin-top:8px; }
.dayg-h{ display:flex; align-items:center; gap:8px; }

.dayg-h .link{ font-size:15px; }

/* Gentle view transition */
#view-home:not([hidden]), #view-moments:not([hidden]), #view-diary:not([hidden]), #view-day:not([hidden]){ animation:viewin .22s ease-out; }

/* Toast */
.toast{
  position:fixed;
  left:50%;
  bottom:calc(92px + env(safe-area-inset-bottom, 0px));
  transform:translateX(-50%);
  color:var(--ink);
  border-radius:999px;
  padding:10px 20px;
  font-size:15px;
  font-weight:600;
  z-index:50;
  animation:up .2s ease-out;
  max-width:calc(100% - 40px);
  text-align:center;
}
body.kb .toast{ bottom:16px; }
.toast:has(.toast-act){ white-space:nowrap; }
/* First-time tips: frosted glass, distinct from the page and the buttons */
.tip{ position:fixed; z-index:80; box-sizing:border-box; color:var(--ink); }
.tip-foot{ align-items:center; }
.tip-step{ color:var(--ink-muted); margin-right:auto; }
.tip-skip{ border:0; background:none; color:var(--ink-muted); font:inherit; font-weight:600; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.tip-arrow{ position:absolute; width:12px; height:12px; background:color-mix(in srgb, #fff 80%, var(--bg)); border:1px solid color-mix(in srgb, #fff 85%, transparent); transform:rotate(45deg); }
.tip.below .tip-arrow{ top:-7px; border-right:0; border-bottom:0; }
.tip.above .tip-arrow{ bottom:-7px; border-left:0; border-top:0; }
.tip-dev{ display:flex; align-items:center; gap:10px; margin:8px 0 0; padding-top:8px; border-top:1px dashed color-mix(in srgb, var(--ink-muted) 35%, transparent); font-size:12px; color:var(--ink-muted); }
.tip-dev code{ margin-right:auto; font-size:12px; }
.tip-dev button{ border:0; background:none; padding:4px 2px; color:var(--ink); font:inherit; font-size:12px; font-weight:600; cursor:pointer; }
.dev-pill{ position:fixed; left:16px; bottom:calc(84px + env(safe-area-inset-bottom, 0px)); z-index:20; border:1.5px dashed var(--ink-muted); border-radius:999px; background:var(--bg); color:var(--ink); font:inherit; font-size:12px; font-weight:700; letter-spacing:.06em; padding:6px 12px; box-shadow:var(--raised); cursor:pointer; }
body.kb .dev-pill{ display:none; }
.dev-list{ list-style:none; margin:8px 0 0; padding:0; }
.dev-list li{ display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--shadow-dark); }
.dev-list .dl-t{ flex:1; font-size:14px; }
.dev-list .dl-t small{ display:block; color:var(--ink-muted); font-size:12px; margin-bottom:2px; }
.tip-ring{ position:fixed; z-index:79; pointer-events:none; border:2px solid #fff; }
.toast-act{ margin-left:14px; padding:4px 0; border:0; background:none; color:var(--accent-strong); font:inherit; font-weight:700; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
/* v1.32 clear-glass look: a near-white page, frosted glass surfaces, and the candy jar as the one place color gathers */
.entry{ position:relative; }
.entry::before{
  position:absolute;
  right:-20px;
  top:-26px;
  width:150px;
  height:100px;
  border-radius:50%;
  pointer-events:none;
  filter:blur(18px);
  background:conic-gradient(from 160deg, rgba(255,240,150,0), rgba(255,236,150,.5), rgba(190,230,255,.55), rgba(230,210,255,.48), rgba(255,210,225,.42), rgba(255,240,150,0));
}
.entry > *:not(.sr-only){ position:relative; }
.tool-ic{ background:#fff; color:var(--ink); box-shadow:inset 0 0 0 1px var(--line), 0 6px 14px -10px var(--glass-sh); }
.tool:active .tool-ic{ box-shadow:inset 0 0 0 1px var(--line), inset 0 2px 6px rgba(0,0,0,.06); }
#home-near .tile{ background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); border:1px solid #fff; box-shadow:inset 0 1px 0 #fff, 0 10px 26px -18px var(--glass-sh); }
#home-near .luck-btn:hover{ background:rgba(255,255,255,.85); border-color:#fff; }
.luck-ic{ background:#fff; box-shadow:inset 0 0 0 1px var(--line); }
.luck-ic svg{ fill:var(--ink-muted); }
.starter::before{ content:""; display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px; vertical-align:1px; background:var(--sd1); }
.starter:nth-child(2)::before{ background:var(--sd2); }
.starter:nth-child(3)::before{ background:var(--sd3); }
.me-pill{ background:var(--glass); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:inset 0 0 0 1px #fff, 0 6px 16px -10px var(--glass-sh); }
.tabbar{ background:color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:0 -1px 0 var(--line); }
.tab{ position:relative; border-bottom:0; }
.tab[aria-current="page"]::after{ position:absolute; bottom:5px; left:50%; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--tab-dot); }
/* The candy jar: clear glass, up to 7 soft candies floating; older moments melt into a syrup layer at the bottom */
.jar{ --jw:132px; position:relative; display:block; width:var(--jw); height:calc(var(--jw) * 1.18); }

${before}
